name: Build Sahi Game APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Buildozer Docker Action
        uses: kivy/buildozer-action@v1
        with:
          command: buildozer android debug

      - name: Rename and Prepare APK
        run: |
          mkdir -p final_apk
          cp bin/*.apk final_apk/sahi_game.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahi_game
          path: final_apk/sahi_game.apk
